global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: headcount-app
    metrics_path: /metrics
    dns_sd_configs:
      - names: [app]
        type: A
        port: 8000
        refresh_interval: 10s

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
